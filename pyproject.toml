[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cinnamon-clipboard"
dynamic = ["version"]
description = "A lightweight clipboard manager for the Cinnamon desktop environment"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GNU General Public License v3.0 or later"}
authors = [
    {name = "Pablo / Vaider13"},
    {name = "Akos Keresztes", email = "akos.keresztes@gmail.com"},
]
# GTK, XApp and Keybinder come from the system (gir1.2-* packages), not from PyPI.
dependencies = [
    "PyGObject",
    "python-xlib",
]

[project.optional-dependencies]
setproctitle = ["setproctitle"]

[project.scripts]
cinnamon-clipboard = "cinnamon_clipboard.app:main"

[project.urls]
Homepage = "https://github.com/xsak/cinnamon-clipboard"
Issues = "https://github.com/xsak/cinnamon-clipboard/issues"

[tool.setuptools.dynamic]
version = {attr = "cinnamon_clipboard._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cinnamon_clipboard*"]

[tool.setuptools.package-data]
cinnamon_clipboard = ["data/*.desktop"]
