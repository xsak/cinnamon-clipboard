name: Build and attach Debian package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y debhelper gettext

      - name: Check release tag matches the package version
        run: |
          version="$(dpkg-parsechangelog -S Version)"
          # Git tags cannot contain "~", so 1.3.4~beta1 is tagged v1.3.4-beta1.
          if [ "$GITHUB_REF_NAME" != "v${version//\~/-}" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match debian/changelog version $version" >&2
            exit 1
          fi

      - name: Build .deb
        run: bash build_deb.sh

      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" cinnamon-clipboard_*_all.deb --clobber
